apis:
- name: Memory Store MCP Server
  description: >-
    The Memory Store Model Context Protocol (MCP) server exposes shared team
    memory to AI clients (Claude, ChatGPT, Cursor, Raycast). It lets agents
    record and recall organizational context, search memory, and read/update
    living "Briefs." The hosted server is provisioned per workspace from the
    Memory Store app.
