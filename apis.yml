aid: memory-store
name: Memory Store
description: >-
  Memory Store is a Y Combinator (Spring 2026) startup building a universal,
  shared memory layer for teams and AI agents. It automatically collects
  insights from communication and productivity tools — Gmail, Slack, Granola,
  Claude, ChatGPT and more — and synthesizes them into an organized, searchable
  "company brain." Memory Store is delivered primarily as a Model Context
  Protocol (MCP) server, letting AI clients such as Claude, ChatGPT, Cursor and
  Raycast record what matters and recall it anywhere without changing existing
  workflows. A signature feature, "Briefs," maintains self-updating living
  documents (decision logs, team status, customer requests) as new information
  arrives.
